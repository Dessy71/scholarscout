<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ScholarScout — personal scholarship & opportunity intelligence" />
    <title>ScholarScout — Opportunity Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23116853'/%3E%3Cpath d='M16 7l9 4.5-9 4.5-9-4.5L16 7z' fill='%23eccb5e'/%3E%3Cpath d='M11 15v4.5c0 1.5 2.2 3 5 3s5-1.5 5-3V15l-5 2.5L11 15z' fill='%23f6f7f9'/%3E%3C/svg%3E" />
    <script>
      // Prevent theme flash: apply saved theme before first paint.
      (function () {
        try {
          var t = localStorage.getItem('scholarscout.theme');
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
